services:
  postgres-social-network-1:
    container_name: postgres-social-network-1
    image: "postgres:latest"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./volumes/psn1:/var/lib/postgresql/data
      - ./volumes/backup:/home/postgres/backup
    labels:
      org.springframework.boot.ignore: true

  postgres-social-network-2:
    container_name: postgres-social-network-2
    image: "postgres:latest"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./volumes/psn2:/var/lib/postgresql/data
    depends_on:
      - postgres-social-network-1
    labels:
      org.springframework.boot.ignore: true

  postgres-social-network-3:
    container_name: postgres-social-network-3
    image: "postgres:latest"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./volumes/psn3:/var/lib/postgresql/data
    depends_on:
      - postgres-social-network-2
    labels:
      org.springframework.boot.ignore: true

  haproxy:
    container_name: haproxy
    image: "haproxy:latest"
    ports:
      - "5432:5432"
      - "5433:5433"
      - "8888:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      - postgres-social-network-1
      - postgres-social-network-2
      - postgres-social-network-3

  server-1:
    container_name: server-1
    build: .
    ports:
      - "8081:8080"
    depends_on:
      - haproxy

  server-2:
    container_name: server-2
    build: .
    ports:
      - "8082:8080"
    depends_on:
      - haproxy

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server-1
      - server-2